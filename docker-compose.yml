
services:

  postgres:
    image: postgres:15
    container_name: celcare_postgres
    restart: always
    environment:
      POSTGRES_DB: celcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  php:
    image: php:8.2-apache
    container_name: celcare_php
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html

volumes:
  postgres_data: